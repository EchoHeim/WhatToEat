<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>tabBar 图标预览</title>
<style>
  :root { --bg:#F7F4ED; --card:#FFFDF8; --ink:#292824; --muted:#8B8982; --line:#E8E2D6;
          --active:#E85D3F; --inactive:#8B8B86; --barbg:#FFFDF8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 24px 64px; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 6px; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:13px; margin:0 0 28px; }
  h2 { font-size:14px; font-weight:600; margin:0 0 14px; color:#4E4C46;
       text-transform:uppercase; letter-spacing:1.2px; }
  .phone { width:360px; border:10px solid #1C1B19; border-radius:44px; overflow:hidden;
           background:var(--card); box-shadow:0 24px 60px rgba(67,49,34,.18); }
  .screen { padding:22px 18px 0; }
  .screen .t { text-align:center; font-weight:700; font-size:16px; margin:6px 0 14px; }
  .screen .hero { border-radius:20px; background:#F4EFE4; padding:26px 0; text-align:center; }
  .screen .hero .big { font-size:22px; font-weight:700; margin-top:10px; }
  .screen .hero .small { color:var(--muted); font-size:12px; margin-top:6px; }
  .bar { display:flex; background:var(--barbg); border-top:1px solid var(--line);
         padding:8px 0 10px; margin:18px -18px 0; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tab img { width:24px; height:24px; display:block; }
  .tab span { font-size:10px; line-height:1.1; }
  .strip { display:flex; gap:8px; background:var(--card); border:1px solid var(--line);
           border-radius:18px; padding:22px 8px 16px; }
  .cell { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cell .pair { display:flex; align-items:center; gap:14px; }
  .cell img { width:36px; height:36px; }
  .cell span { font-size:12px; color:var(--muted); }
  .legend { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted);
            margin:12px 0 0 4px; }
  .dot { width:11px; height:11px; border-radius:50%; display:inline-block; }
  .row { margin-bottom:36px; }
</style></head><body><div class="wrap">
